name: Release & Publish

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          # Generate changelog between tags
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..HEAD)
          fi

          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            --repo="${GITHUB_REPOSITORY}" \
            --title="Release ${TAG_NAME}" \
            --notes="## What's Changed
          ${{ steps.changelog.outputs.CHANGELOG }}

          ## Installation
          Download the appropriate installer for your platform below.

          **Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${TAG_NAME}"

  build-and-release:
    name: Build & Upload (${{ matrix.os }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Package application (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm --filter @polynote/desktop run package:linux

      - name: Package application (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pnpm --filter @polynote/desktop run package:mac

      - name: Package application (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pnpm --filter @polynote/desktop run package:win

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          cd apps/desktop/dist
          # Upload all distributable files (not unpacked directories)
          for file in *.{AppImage,deb,rpm,dmg,zip,exe,msi}; do
            if [ -f "$file" ]; then
              echo "Uploading $file..."
              gh release upload "$TAG_NAME" "$file" --repo="${GITHUB_REPOSITORY}" --clobber
            fi
          done

